name: Sync Upstream

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork trunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fork
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror upstream main and upsert draft sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Never enable set -x: transient auth headers are constructed in this step.
          set -euo pipefail

          BASIC_B64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
          printf '::add-mask::%s\n' "$BASIC_B64"
          AUTH_HEADER="AUTHORIZATION: basic ${BASIC_B64}"
          printf '::add-mask::%s\n' "$AUTH_HEADER"
          unset BASIC_B64

          BOT_NAME="github-actions[bot]"
          BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"

          safe_git() {
            git -c core.hooksPath=/dev/null -c submodule.recurse=false "$@"
          }

          safe_git_bot() {
            safe_git -c "user.name=${BOT_NAME}" -c "user.email=${BOT_EMAIL}" "$@"
          }

          semver_gt() {
            local lhs="$1"
            local rhs="$2"
            if [[ "$lhs" =~ ^[0-9]+\.[0-9]+$ ]]; then
              lhs="${lhs}.0"
            fi
            if [[ "$rhs" =~ ^[0-9]+\.[0-9]+$ ]]; then
              rhs="${rhs}.0"
            fi
            dpkg --compare-versions -- "$lhs" gt "$rhs"
          }

          safe_git fetch --no-recurse-submodules origin +refs/heads/main:refs/remotes/origin/main
          safe_git fetch --no-recurse-submodules https://github.com/vladimir-ikryanov/ClipBook.git +refs/heads/main:refs/remotes/upstream/main
          safe_git fetch --no-recurse-submodules origin +refs/heads/chore/sync-upstream:refs/remotes/origin/chore/sync-upstream 2>/dev/null || true
          PREV_SYNC_SHA="$(safe_git rev-parse -q --verify refs/remotes/origin/chore/sync-upstream || true)"

          MERGE_BASE_HEAD="$(safe_git merge-base HEAD refs/remotes/upstream/main)"
          WF_DIFF_MAIN="$(safe_git diff --name-only refs/remotes/origin/main..refs/remotes/upstream/main -- .github/workflows/)"
          WF_DIFF_HEAD="$(safe_git diff --name-only "${MERGE_BASE_HEAD}..refs/remotes/upstream/main" -- .github/workflows/)"
          if [[ -n "$WF_DIFF_MAIN" || -n "$WF_DIFF_HEAD" ]]; then
            printf 'Error: Upstream modified .github/workflows/. Manual security review is required before syncing:\n%s\n%s\n' \
              "$WF_DIFF_MAIN" "$WF_DIFF_HEAD" >&2
            exit 1
          fi

          safe_git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
            push origin refs/remotes/upstream/main:refs/heads/main

          PR_NUMBER="$(gh api --method GET "repos/${GH_REPO}/pulls" -f state=open -f base=fork -f "head=${GITHUB_REPOSITORY_OWNER}:chore/sync-upstream" --jq "[.[] | select(.head.repo.full_name == \"${GH_REPO}\")][0].number // empty")"
          UPSTREAM_SHA="$(safe_git rev-parse --short=7 refs/remotes/upstream/main)"

          if [[ -n "$PR_NUMBER" && -n "$PREV_SYNC_SHA" ]]; then
            if safe_git log --format='%ae%n%ce' refs/remotes/origin/chore/sync-upstream --not HEAD refs/remotes/upstream/main \
              | grep -Fxv "$BOT_EMAIL" >/dev/null; then
              printf 'Open PR #%s has human commits on chore/sync-upstream; skipping automated overwrite.\n' "$PR_NUMBER"
              exit 0
            fi
          fi

          CURRENT_HEAD_VERSION="$(safe_git show HEAD:FORK_UPSTREAM_VERSION | tr -d '[:space:]')"
          if [[ ! "$CURRENT_HEAD_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            printf 'Error: Malformed HEAD:FORK_UPSTREAM_VERSION: %s\n' "$CURRENT_HEAD_VERSION" >&2
            exit 1
          fi

          if [[ -n "$PR_NUMBER" && -n "$PREV_SYNC_SHA" ]]; then
            BASELINE_VERSION="$(safe_git show refs/remotes/origin/chore/sync-upstream:FORK_UPSTREAM_VERSION | tr -d '[:space:]')"
          else
            BASELINE_VERSION="$CURRENT_HEAD_VERSION"
          fi
          if [[ ! "$BASELINE_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            printf 'Error: Malformed BASELINE_VERSION: %s\n' "$BASELINE_VERSION" >&2
            exit 1
          fi

          CANDIDATE_UPSTREAM_VERSION="$(
            curl -fsSL --proto '=https' --tlsv1.2 --max-redirs 3 --connect-timeout 10 --max-time 20 --max-filesize 1048576 \
              https://clipbook.app/downloads/mac/appcast.xml \
            | /usr/bin/python3 -I -c '
          import re
          import sys
          import xml.etree.ElementTree as ET

          MAX_BYTES = 1048576
          SPARKLE_SHORT_VERSION = "{http://www.andymatuschak.org/xml-namespaces/sparkle}shortVersionString"

          raw = sys.stdin.buffer.read(MAX_BYTES + 1)
          if not raw or len(raw) > MAX_BYTES or re.search(br"<!\s*(?:DOCTYPE|ENTITY)", raw, re.I):
              sys.exit(1)

          root = ET.fromstring(raw)
          raw_vals = [e.text.strip() for e in root.iter(SPARKLE_SHORT_VERSION) if e.text] + [
              e.attrib[SPARKLE_SHORT_VERSION].strip()
              for e in root.iter()
              if SPARKLE_SHORT_VERSION in e.attrib
          ]
          vals = [v for v in raw_vals if re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}", v)]
          if not vals:
              sys.exit(1)

          def version_key(s):
              parts = tuple(int(p) for p in s.split("."))
              return ((parts + (0,))[:3], len(parts))

          print(max(vals, key=version_key))
          ' 2>/dev/null || true
          )"
          if [[ -n "$CANDIDATE_UPSTREAM_VERSION" && ! "$CANDIDATE_UPSTREAM_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            printf 'Error: Invalid CANDIDATE_UPSTREAM_VERSION parsed: %s\n' "$CANDIDATE_UPSTREAM_VERSION" >&2
            exit 1
          fi

          COMMITS_TRACKED=0
          if safe_git merge-base --is-ancestor refs/remotes/upstream/main HEAD; then
            COMMITS_TRACKED=1
          elif [[ -n "$PR_NUMBER" && -n "$PREV_SYNC_SHA" ]] && \
            safe_git log -1 --format='%B' refs/remotes/origin/chore/sync-upstream | grep -F "[upstream:${UPSTREAM_SHA}]" >/dev/null; then
            COMMITS_TRACKED=1
          fi

          VERSION_ADVANCED=0
          if [[ -n "$CANDIDATE_UPSTREAM_VERSION" ]] && semver_gt "$CANDIDATE_UPSTREAM_VERSION" "$BASELINE_VERSION"; then
            VERSION_ADVANCED=1
          fi

          if [[ "$COMMITS_TRACKED" -eq 1 && "$VERSION_ADVANCED" -eq 0 ]]; then
            printf 'Upstream (%s) and baseline version (%s) are already synced; exiting cleanly.\n' "$UPSTREAM_SHA" "$BASELINE_VERSION"
            exit 0
          fi

          safe_git switch -C chore/sync-upstream HEAD

          if safe_git_bot merge --no-edit -m "chore(upstream): merges upstream main [upstream:${UPSTREAM_SHA}]" refs/remotes/upstream/main; then
            VERSION_SUMMARY="Upstream marketing version baseline remains \`${CURRENT_HEAD_VERSION}\`."
            if [[ -n "$CANDIDATE_UPSTREAM_VERSION" ]] && semver_gt "$CANDIDATE_UPSTREAM_VERSION" "$CURRENT_HEAD_VERSION"; then
              printf '%s\n' "$CANDIDATE_UPSTREAM_VERSION" > FORK_UPSTREAM_VERSION
              safe_git add FORK_UPSTREAM_VERSION
              safe_git_bot commit -m "chore(upstream): bumps baseline to ${CANDIDATE_UPSTREAM_VERSION} [upstream:${UPSTREAM_SHA}]"
              VERSION_SUMMARY="Bumps \`FORK_UPSTREAM_VERSION\` from \`${CURRENT_HEAD_VERSION}\` to \`${CANDIDATE_UPSTREAM_VERSION}\`."
            fi
            PR_TITLE="chore(upstream): syncs upstream ClipBook (${UPSTREAM_SHA})"
            PR_BODY="## Summary
          - Merges upstream \`vladimir-ikryanov/ClipBook\` \`main\` (${UPSTREAM_SHA}) cleanly onto \`fork\`
          - ${VERSION_SUMMARY}
          - Mark this draft PR **Ready for review** in GitHub to trigger \`build-and-test\` before merging with a merge commit"
          else
            safe_git merge --abort
            COMMIT_FLAGS=(--allow-empty)
            if [[ -n "$CANDIDATE_UPSTREAM_VERSION" ]] && semver_gt "$CANDIDATE_UPSTREAM_VERSION" "$CURRENT_HEAD_VERSION"; then
              printf '%s\n' "$CANDIDATE_UPSTREAM_VERSION" > FORK_UPSTREAM_VERSION
              safe_git add FORK_UPSTREAM_VERSION
              COMMIT_FLAGS=()
            fi
            safe_git_bot commit ${COMMIT_FLAGS[@]+"${COMMIT_FLAGS[@]}"} \
              -m "chore(upstream): flags sync conflict [upstream:${UPSTREAM_SHA}]"
            PR_TITLE="chore(upstream): resolves upstream ClipBook sync (${UPSTREAM_SHA})"
            PR_BODY="## Summary
          - Upstream \`vladimir-ikryanov/ClipBook\` \`main\` (${UPSTREAM_SHA}) conflicted with \`fork\` during automated merge
          - Resolve locally with \`git fetch origin && git switch chore/sync-upstream && git merge origin/main\`, run \`/bin/bash test.sh\`, push, and mark **Ready for review**"
          fi

          if [[ -n "$PR_NUMBER" ]]; then
            IS_PR_DRAFT="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft --jq .isDraft)"
            if [[ "$IS_PR_DRAFT" == "false" ]]; then
              gh pr ready "$PR_NUMBER" --repo "$GH_REPO" --undo
            fi
          fi

          safe_git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" \
            push --force-with-lease="refs/heads/chore/sync-upstream:${PREV_SYNC_SHA}" origin chore/sync-upstream:chore/sync-upstream

          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --repo "$GH_REPO" --base fork --head "${GITHUB_REPOSITORY_OWNER}:chore/sync-upstream" --draft \
              --title "$PR_TITLE" --body "$PR_BODY"
          fi
