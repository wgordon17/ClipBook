name: CI

on:
  pull_request:
    branches:
      - fork
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Marking a PR ready for review changes no code. The macOS suite runs on that
  # event only when this head commit has no successful CI run yet, which is the
  # case for PRs opened with GITHUB_TOKEN (their open event starts no workflow).
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-macos: ${{ steps.decide.outputs.run-macos }}
    steps:
      - name: Decide whether the macOS suite must run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          RUN_MACOS=true
          if [[ "$EVENT_ACTION" == "ready_for_review" && -n "$HEAD_SHA" ]]; then
            if SUCCESSFUL_RUNS="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$HEAD_SHA" -f event=pull_request -f status=success --jq '.total_count')"; then
              if [[ "$SUCCESSFUL_RUNS" =~ ^[0-9]+$ ]] && (( SUCCESSFUL_RUNS > 0 )); then
                RUN_MACOS=false
              fi
            fi
          fi
          printf 'run-macos=%s\n' "$RUN_MACOS" >> "$GITHUB_OUTPUT"
          printf 'run-macos=%s (action=%s, head=%s)\n' "$RUN_MACOS" "$EVENT_ACTION" "$HEAD_SHA"

  macos-test:
    needs:
      - decide
    if: needs.decide.outputs.run-macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run Swift Testing suite
        env:
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/ClipBookTests.xcresult
          SNAPSHOT_EXPORT_DIR: ${{ runner.temp }}/exported-snapshots
          PERF_SUMMARY_PATH: ${{ runner.temp }}/perf-summary.md
        run: ./test.sh

      - name: Publish performance summary
        if: always()
        run: |
          if [[ -s "${{ runner.temp }}/perf-summary.md" ]]; then
            cat "${{ runner.temp }}/perf-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke-test universal Release packaging and rcodesign signing
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          umask 077

          SMOKE_TMP="$RUNNER_TEMP/ci-release-smoke"
          rm -rf "$SMOKE_TMP"
          mkdir -p "$SMOKE_TMP"
          trap 'rm -rf "$SMOKE_TMP"' EXIT

          TARBALL="$SMOKE_TMP/apple-codesign-0.29.0-macos-universal.tar.gz"
          EXPECTED_SHA256="d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d"
          curl -fsSL --proto '=https' --tlsv1.2 --max-redirs 5 --connect-timeout 10 --max-time 60 \
            -o "$TARBALL" \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz"
          ACTUAL_SHA256="$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            printf 'Error: rcodesign SHA-256 mismatch: expected %s, got %s\n' "$EXPECTED_SHA256" "$ACTUAL_SHA256" >&2
            rm -rf "$SMOKE_TMP"
            exit 1
          fi
          mkdir -p "$SMOKE_TMP/rcodesign-bin"
          tar -xzf "$TARBALL" --strip-components=1 -C "$SMOKE_TMP/rcodesign-bin"
          rm -f "$TARBALL"

          {
            printf '[req]\n'
            printf 'distinguished_name = dn\n'
            printf 'x509_extensions = v3_codesign\n'
            printf 'prompt = no\n\n'
            printf '[dn]\n'
            printf 'CN = ClipBook CI Smoke Signing\n\n'
            printf '[v3_codesign]\n'
            printf 'basicConstraints = critical,CA:FALSE\n'
            printf 'keyUsage = critical,digitalSignature\n'
            printf 'extendedKeyUsage = critical,codeSigning\n'
          } > "$SMOKE_TMP/openssl.cnf"

          /usr/bin/openssl req -x509 -newkey rsa:3072 -nodes \
            -keyout "$SMOKE_TMP/smoke.key" \
            -out "$SMOKE_TMP/smoke.crt" \
            -sha256 -days 1 \
            -config "$SMOKE_TMP/openssl.cnf" \
            -extensions v3_codesign 2>/dev/null

          SMOKE_P12_PASS="$(/usr/bin/openssl rand -hex 32 | tr -d '\r\n[:space:]')"
          printf '%s' "$SMOKE_P12_PASS" > "$SMOKE_TMP/smoke.pass"
          /usr/bin/openssl pkcs12 -export \
            -inkey "$SMOKE_TMP/smoke.key" \
            -in "$SMOKE_TMP/smoke.crt" \
            -name "ClipBook CI Smoke Signing" \
            -certpbe PBE-SHA1-3DES \
            -keypbe PBE-SHA1-3DES \
            -macalg sha1 \
            -passout stdin \
            -out "$SMOKE_TMP/smoke.p12" <<< "$SMOKE_P12_PASS"
          unset SMOKE_P12_PASS

          RCODESIGN_BIN="$SMOKE_TMP/rcodesign-bin/rcodesign" \
          RCODESIGN_POISON_PROBE="1" \
          ./scripts/release-fork.sh \
            --run-number 1 \
            --smoke-test \
            --p12-file "$SMOKE_TMP/smoke.p12" \
            --p12-password-file "$SMOKE_TMP/smoke.pass" \
            --rcodesign-bin "$SMOKE_TMP/rcodesign-bin/rcodesign" \
            --output-dir "$SMOKE_TMP/out"

          rm -rf "$SMOKE_TMP"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClipBookTests-xcresult
          path: ${{ runner.temp }}/ClipBookTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload exported snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClipBookTests-snapshots
          path: ${{ runner.temp }}/exported-snapshots
          if-no-files-found: ignore
          retention-days: 7

  build-and-test:
    if: always()
    needs:
      - decide
      - macos-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require macOS CI success
        env:
          DECIDE_RESULT: ${{ needs.decide.result }}
          RUN_MACOS: ${{ needs.decide.outputs.run-macos }}
          MACOS_RESULT: ${{ needs.macos-test.result }}
        run: |
          set -euo pipefail
          if [[ "$MACOS_RESULT" == "success" ]]; then
            printf 'macOS CI succeeded.\n'
            exit 0
          fi
          if [[ "$MACOS_RESULT" == "skipped" && "$DECIDE_RESULT" == "success" && "$RUN_MACOS" == "false" ]]; then
            printf 'macOS CI already succeeded for this commit; not re-run.\n'
            exit 0
          fi
          printf 'macOS CI did not succeed (decide=%s, run-macos=%s, macos-test=%s).\n' \
            "$DECIDE_RESULT" "$RUN_MACOS" "$MACOS_RESULT" >&2
          exit 1
